<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 Movie Search Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Load Settings and Links BEFORE the main logic -->
    <script src="settings.js"></script>
    <script src="links.js"></script>

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #f0f2f8;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #3d3d5c;
            --text-muted: #6b6b8a;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.15);
            --glow: rgba(99, 102, 241, 0.20);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --radius: 16px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(26, 26, 46, 0.80);
            --bg-card-hover: rgba(40, 40, 70, 0.95);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0cc;
            --text-muted: #8080a0;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.40);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.60);
            --glow: rgba(99, 102, 241, 0.30);
            --input-bg: #1e1e36;
            --input-border: #3a3a5a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 60px;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(236, 72, 153, 0.06) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* ===== ANIMATED BACKGROUND PARTICLES ===== */
        .bg-ornament {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-ornament span {
            position: absolute;
            border-radius: 50%;
            animation: floatOrb 20s ease-in-out infinite alternate;
        }

        .bg-ornament span:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08), transparent 70%);
            animation-duration: 25s;
        }

        .bg-ornament span:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.07), transparent 70%);
            animation-duration: 30s;
            animation-delay: 2s;
        }

        .bg-ornament span:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 60%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.05), transparent 70%);
            animation-duration: 22s;
            animation-delay: 4s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(40px, -30px) scale(1.05);
            }

            66% {
                transform: translate(-20px, 50px) scale(0.95);
            }

            100% {
                transform: translate(30px, -10px) scale(1.02);
            }
        }

        /* ===== HEADER ===== */
        .app-header {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 820px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 2rem;
            line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.25));
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle {
            position: relative;
            width: 52px;
            height: 28px;
            border-radius: 50px;
            border: none;
            background: var(--bg-secondary);
            box-shadow: inset 0 0 0 1px var(--border-color), var(--shadow);
            cursor: pointer;
            transition: background var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 3px;
        }

        .theme-toggle .toggle-track {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .theme-toggle .toggle-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
            transition: transform var(--transition), background var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
        }

        [data-theme="dark"] .theme-toggle .toggle-thumb {
            transform: translateX(24px);
            background: #fbbf24;
        }

        [data-theme="light"] .theme-toggle .toggle-thumb i {
            color: #fff;
        }

        /* ===== SEARCH SECTION ===== */
        .search-section {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 820px;
            margin-top: 4px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 6px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: box-shadow var(--transition), border-color var(--transition);
            backdrop-filter: blur(4px);
        }

        .search-box:focus-within {
            box-shadow: 0 0 0 4px var(--glow), var(--shadow-hover);
            border-color: var(--accent);
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 18px;
            font-size: 1rem;
            font-family: var(--font);
            color: var(--text-primary);
            outline: none;
            min-width: 0;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .search-box .search-btn {
            background: var(--accent);
            border: none;
            border-radius: calc(var(--radius) - 4px);
            padding: 14px 28px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .search-box .search-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .search-tips {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .search-tips kbd {
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* ===== RESULTS ===== */
        .results-section {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 820px;
            margin-top: 28px;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .results-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .results-header h2 span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.9rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            align-items: start;
            gap: 14px;
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 16px 18px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .result-card:hover {
            box-shadow: var(--shadow-hover);
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .result-card .site-icon {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            z-index: 1;
        }

        .result-card .site-icon i {
            font-size: 1.1rem;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--accent);
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .result-card .site-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex: 1;
        }

        .result-card .site-url {
            font-size: 0.75rem;
            color: var(--text-muted);
            word-break: break-all;
            padding: 6px 10px;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-family: monospace;
            max-height: 60px;
            overflow-y: auto;
        }

        .result-card .open-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 500;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: background var(--transition);
            text-decoration: none;
            width: fit-content;
            font-family: var(--font);
        }

        .result-card .open-link:hover {
            background: var(--accent-hover);
        }

        /* EMBED CONTAINER */
        .embed-container {
            width: 100%;
            margin-top: 12px;
            border-radius: 8px;
            overflow: hidden;
            height: 400px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        .embed-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="bg-ornament" aria-hidden="true"><span></span><span></span><span></span></div>

    <header class="app-header">
        <div class="logo-area">
            <span class="logo-icon">🎬</span>
            <span class="logo-text">MoviePortal</span>
        </div>
        <button class="theme-toggle" id="themeToggle">
            <span class="toggle-track">
                <span><i class="fas fa-sun" style="font-size:11px;"></i></span>
                <span><i class="fas fa-moon" style="font-size:11px;"></i></span>
                <span class="toggle-thumb" id="toggleThumb"><i class="fas fa-sun" id="thumbIcon"></i></span>
            </span>
        </button>
    </header>

    <section class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for any movie" autofocus />
            <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i> Search</button>
        </div>
        <div class="search-tips">
            <i class="fas fa-lightbulb"></i> Press <kbd>Enter</kbd> to search
        </div>
    </section>

    <section class="results-section" id="resultsSection">
        <div class="results-header">
            <h2 id="resultsTitle"><i class="fas fa-link" style="opacity:0.5;"></i> Search Results <span
                    id="resultCount"></span></h2>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
        <div class="empty-state" id="emptyState">
            <i class="fas fa-film"></i>
            <p>Type a movie name above and hit Search.</p>
        </div>
    </section>

    <script>
        (function () {
            'use strict';

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultsGrid = document.getElementById('resultsGrid');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('resultCount');
            const themeToggle = document.getElementById('themeToggle');
            const thumbIcon = document.getElementById('thumbIcon');

            function encodePlus(str) {
                return str.trim().replace(/\s+/g, '+');
            }

            function render(query) {
                // Ensure sites array from links.js is available
                if (typeof sites === 'undefined') {
                    alert('Error: sites data from links.js is missing.');
                    return;
                }

                resultsGrid.innerHTML = '';

                if (!query) {
                    emptyState.classList.remove('hidden');
                    resultsGrid.classList.add('hidden');
                    resultCount.textContent = '';
                    return;
                }

                const plusQuery = encodePlus(query);
                emptyState.classList.add('hidden');
                resultsGrid.classList.remove('hidden');
                resultCount.textContent = `(${sites.length})`;

                sites.forEach((site, index) => {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.style.animationDelay = `${index * 40}ms`;

                    const finalUrl = site.url(plusQuery);

                    // Generate UI elements conditionally based on settings.js
                    const nameHtml = appSettings.showNames ? `<span class="site-name">${site.name}</span>` : '';
                    const urlHtml = appSettings.showLinks ? `<div class="site-url" title="${finalUrl}">${finalUrl}</div>` : '';

                    // Action button logic (Embed vs New Tab)
                    let actionHtml = '';
                    if (appSettings.embed) {
                        actionHtml = `<button class="open-link embed-btn" data-url="${finalUrl}"><i class="fas fa-chevron-down"></i> Open Here</button>`;
                    } else {
                        actionHtml = `<a href="${finalUrl}" target="_blank" rel="noopener noreferrer" class="open-link"><i class="fas fa-external-link-alt"></i> Open</a>`;
                    }

                    card.innerHTML = `
                        <div class="site-icon">
                            <i class="${site.icon}"></i>
                            ${nameHtml}
                        </div>
                        ${urlHtml}
                        ${actionHtml}
                        <div class="embed-container hidden"></div>
                    `;

                    resultsGrid.appendChild(card);
                });
            }

            // Embed Button Event Delegation
            resultsGrid.addEventListener('click', (e) => {
                const embedBtn = e.target.closest('.embed-btn');
                if (!embedBtn) return;

                const url = embedBtn.getAttribute('data-url');
                const card = embedBtn.closest('.result-card');
                const embedContainer = card.querySelector('.embed-container');

                if (embedContainer.classList.contains('hidden')) {
                    embedContainer.innerHTML = `<iframe src="${url}"></iframe>`;
                    embedContainer.classList.remove('hidden');
                    embedBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Close View';
                    embedBtn.style.background = 'var(--text-muted)';
                } else {
                    embedContainer.innerHTML = '';
                    embedContainer.classList.add('hidden');
                    embedBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Open Here';
                    embedBtn.style.background = 'var(--accent)';
                }
            });

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    searchInput.focus();
                    return;
                }
                render(query);
            }

            // Theme Handling
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                thumbIcon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            }

            themeToggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            // Init Events
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') performSearch();
            });

        })();
    </script>
</body>

</html>
